# Server
server.port=8082

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/shoppingkart-cart?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Service URLs
user.service.base-url=http://localhost:8080
product.service.base-url=http://localhost:8081

# Feign Client URLs
#services.user.url=http://localhost:8080
#services.product.url=http://localhost:8081

# ============================================================
# User Service Resilience4j Configuration
# ============================================================

# Circuit Breaker
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true
# FIX: Ignore bulkhead/rejection exceptions so they propagate as 429
resilience4j.circuitbreaker.instances.userService.ignore-exceptions[0]=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.userService.ignore-exceptions[1]=com.shoppingkart.cartservice.exception.TooManyConcurrentRequestsException

# Retry
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=2s
resilience4j.retry.instances.userService.retry-exceptions[0]=com.shoppingkart.cartservice.exception.RemoteServiceUnavailableException
resilience4j.retry.instances.userService.retry-exceptions[1]=com.shoppingkart.cartservice.exception.RemoteServiceInternalException
resilience4j.retry.instances.userService.ignore-exceptions[0]=com.shoppingkart.cartservice.exception.ResourceNotFoundException
resilience4j.retry.instances.userService.ignore-exceptions[1]=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.retry.instances.userService.ignore-exceptions[2]=com.shoppingkart.cartservice.exception.TooManyConcurrentRequestsException

# Bulkhead
resilience4j.bulkhead.instances.userService.max-concurrent-calls=3
resilience4j.bulkhead.instances.userService.max-wait-duration=0

# ============================================================
# Product Service Resilience4j Configuration
# ============================================================

# Circuit Breaker
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true
# FIX: Ignore bulkhead/rejection exceptions so they propagate as 429
resilience4j.circuitbreaker.instances.productService.ignore-exceptions[0]=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.productService.ignore-exceptions[1]=com.shoppingkart.cartservice.exception.TooManyConcurrentRequestsException

# Retry
resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=2s
resilience4j.retry.instances.productService.retry-exceptions[0]=com.shoppingkart.cartservice.exception.RemoteServiceUnavailableException
resilience4j.retry.instances.productService.retry-exceptions[1]=com.shoppingkart.cartservice.exception.RemoteServiceInternalException
resilience4j.retry.instances.productService.ignore-exceptions[0]=com.shoppingkart.cartservice.exception.ResourceNotFoundException
resilience4j.retry.instances.productService.ignore-exceptions[1]=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.retry.instances.productService.ignore-exceptions[2]=com.shoppingkart.cartservice.exception.TooManyConcurrentRequestsException

# Bulkhead
resilience4j.bulkhead.instances.productService.max-concurrent-calls=3
resilience4j.bulkhead.instances.productService.max-wait-duration=0

# ============================================================
# Feign Client Configuration
# ============================================================
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.default.loggerLevel=FULL

# Time Limiter
resilience4j.timelimiter.instances.slowService.timeout-duration=2s
resilience4j.timelimiter.instances.slowService.cancel-running-future=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,bulkheads,retries
management.endpoint.health.show-details=always


#####################################
# Eureka Client
#####################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
